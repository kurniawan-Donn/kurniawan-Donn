<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Focus areas: IT Audit (controls, evidence, gap analysis), IT Governance (ISO 27001 and COBIT 2019, learning), Cybersecurity (threats, privacy, secure tools)">
<title>Focus areas: IT Audit (controls, evidence, gap analysis), IT Governance (ISO 27001 and COBIT 2019, learning), Cybersecurity (threats, privacy, secure tools)</title>
<style>
  .card{opacity:0;animation:enter .8s ease-out forwards}
  .c2{animation-delay:.18s}
  .c3{animation-delay:.36s}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .bar{transform-box:fill-box;transform-origin:left center;animation:bar 5s ease-in-out infinite}
  @keyframes bar{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.9)}}

  .ring{animation:ringglow 4s ease-in-out infinite}
  @keyframes ringglow{0%,100%{stroke-opacity:.3}50%{stroke-opacity:.7}}

  .ripple{fill:none;stroke:#00D9FF;stroke-width:1.5;transform-box:fill-box;transform-origin:center;opacity:0;animation:ripple 4.5s ease-out infinite}
  .c2 .ripple{animation-delay:1.1s}
  .c3 .ripple{animation-delay:2.2s}
  @keyframes ripple{0%{transform:scale(1);opacity:.45}80%,100%{transform:scale(1.35);opacity:0}}

  .float{animation:float 5s ease-in-out infinite}
  .c2 .float{animation-delay:.8s}
  .c3 .float{animation-delay:1.6s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .tick{stroke-dasharray:24;animation:tick 6s ease-in-out infinite}
  .tick2{animation-delay:.5s}
  @keyframes tick{0%{stroke-dashoffset:24}18%,88%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:24}}

  .node{animation:node 4.5s ease-in-out infinite}
  .n2{animation-delay:.6s}
  .n3{animation-delay:1.2s}
  @keyframes node{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}

  .lockbody{animation:lock 4s ease-in-out infinite}
  @keyframes lock{0%,100%{fill-opacity:.7}50%{fill-opacity:1}}

  .sub{animation:sub 6s ease-in-out infinite}
  @keyframes sub{0%,100%{opacity:.85}50%{opacity:1}}

  @media (prefers-reduced-motion:reduce){
    .card,.bar,.ring,.ripple,.float,.tick,.node,.lockbody,.sub{animation:none!important;opacity:1}
    .ripple{opacity:0}
    .tick{stroke-dashoffset:0}
  }
</style>

<!-- Card 1: IT Audit -->
<g transform="translate(0 0)"><g class="card c1">
  <rect x=".5" y=".5" width="383" height="209" rx="14" fill="#11151B" stroke="#232A33"/>
  <rect class="bar" x="28" y="0" width="48" height="3" rx="1.5" fill="#00D9FF"/>
  <circle class="ring" cx="70" cy="78" r="42" fill="#080A0D" stroke="#00D9FF" stroke-opacity=".35"/>
  <circle class="ripple" cx="70" cy="78" r="42"/>
  <g transform="translate(70 78)"><g class="float">
    <rect x="-22" y="-26" width="44" height="54" rx="6" fill="none" stroke="#00D9FF" stroke-width="3"/>
    <rect x="-10" y="-32" width="20" height="10" rx="3" fill="#11151B" stroke="#00D9FF" stroke-width="3"/>
    <path class="tick" d="M-12 -4 l5 5 l9 -9" fill="none" stroke="#00D9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="tick tick2" d="M-12 14 l5 5 l9 -9" fill="none" stroke="#00D9FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 -4 h8 M6 14 h8" stroke="#00D9FF" stroke-width="3" stroke-linecap="round"/>
  </g></g>
  <text x="28" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F0E9">IT Audit</text>
  <text class="sub" x="28" y="188" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#9299A5">controls · evidence · gap analysis</text>
</g></g>

<!-- Card 2: IT Governance -->
<g transform="translate(408 0)"><g class="card c2">
  <rect x=".5" y=".5" width="383" height="209" rx="14" fill="#11151B" stroke="#232A33"/>
  <rect class="bar" x="28" y="0" width="48" height="3" rx="1.5" fill="#00D9FF" style="animation-delay:.6s"/>
  <circle class="ring" cx="70" cy="78" r="42" fill="#080A0D" stroke="#00D9FF" stroke-opacity=".35" style="animation-delay:.8s"/>
  <circle class="ripple" cx="70" cy="78" r="42"/>
  <g transform="translate(70 78)"><g class="float">
    <rect class="node n1" x="-10" y="-30" width="20" height="16" rx="4" fill="none" stroke="#00D9FF" stroke-width="3"/>
    <rect class="node n2" x="-32" y="12" width="20" height="16" rx="4" fill="none" stroke="#00D9FF" stroke-width="3"/>
    <rect class="node n3" x="12" y="12" width="20" height="16" rx="4" fill="none" stroke="#00D9FF" stroke-width="3"/>
    <path d="M0 -14 V0 M-22 12 V0 H22 V12" fill="none" stroke="#00D9FF" stroke-width="3" stroke-linejoin="round"/>
  </g></g>
  <text x="28" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F0E9">IT Governance</text>
  <text class="sub" x="28" y="188" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#9299A5" style="animation-delay:.8s">ISO 27001 · COBIT 2019 (learning)</text>
</g></g>

<!-- Card 3: Cybersecurity -->
<g transform="translate(816 0)"><g class="card c3">
  <rect x=".5" y=".5" width="383" height="209" rx="14" fill="#11151B" stroke="#232A33"/>
  <rect class="bar" x="28" y="0" width="48" height="3" rx="1.5" fill="#00D9FF" style="animation-delay:1.2s"/>
  <circle class="ring" cx="70" cy="78" r="42" fill="#080A0D" stroke="#00D9FF" stroke-opacity=".35" style="animation-delay:1.6s"/>
  <circle class="ripple" cx="70" cy="78" r="42"/>
  <g transform="translate(70 78)"><g class="float">
    <path d="M0-32 L26-22 V0 C26 18 14 28 0 34 C-14 28 -26 18 -26 0 V-22 Z" fill="none" stroke="#00D9FF" stroke-width="3"/>
    <rect class="lockbody" x="-10" y="-2" width="20" height="16" rx="3" fill="#00D9FF"/>
    <path d="M-6 -2 V-8 a6 6 0 0 1 12 0 V-2" fill="none" stroke="#00D9FF" stroke-width="3"/>
  </g></g>
  <text x="28" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F0E9">Cybersecurity</text>
  <text class="sub" x="28" y="188" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#9299A5" style="animation-delay:1.6s">threats · privacy · secure tools</text>
</g></g>
</svg>
